name: Publish TMS AI Router Release

on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, curl, sodium, zip
      - name: Read version and verify source
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          VERSION="$(tr -d '\r\n ' < VERSION)"
          test -n "$VERSION"
          grep -q "'version' => '$VERSION'" config/app.php
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build hot-update package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .release
          git archive --format=zip --output=.release/TMS_AI_ROUTER.zip HEAD
          SHA="$(sha256sum .release/TMS_AI_ROUTER.zip | awk '{print $1}')"
          cat > .release/RELEASE.json <<EOF
          {
            "product": "TMS AI Router",
            "name": "TMS AI Router v${VERSION}",
            "version": "${VERSION}",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "download_url": "https://github.com/geogich961-lab/tms-ai-router/releases/download/v${VERSION}/TMS_AI_ROUTER.zip",
            "checksum_sha256": "${SHA}",
            "notes": "v${VERSION}: rewrite-safe dashboard transport, resilient GitHub update discovery, packaged hot updates, checksum verification and automatic source rollback."
          }
          EOF
      - name: Publish release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="v${VERSION}"
          cat > .release/NOTES.md <<EOF
          TMS AI Router ${TAG}

          ## Highlights
          - Dashboard AJAX now uses a rewrite-safe root transport designed for TMS OS/Nginx/Cloudflare.
          - Hot Update checks GitHub through three fallback paths: Releases API, RELEASE.json asset and raw VERSION.
          - Release ZIP has SHA-256 verification before deployment.
          - Source is backed up and automatically rolled back if deployment fails; storage/SQLite/master key are never replaced.
          - Existing OpenAI-compatible SSE, /v1/responses, Anthropic and Gemini adapters remain available.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .release/TMS_AI_ROUTER.zip .release/RELEASE.json --clobber
          else
            gh release create "$TAG" .release/TMS_AI_ROUTER.zip .release/RELEASE.json --target "$GITHUB_SHA" --title "TMS AI Router ${TAG}" --notes-file .release/NOTES.md
          fi
