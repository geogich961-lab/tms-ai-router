name: TMS AI Router CI

on:
  push:
    branches: [main, 'feat/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, curl, sodium, zip
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Shell syntax
        run: bash -n scripts/hot-update-worker.sh
      - name: Validate v1.2.2 safe update surface
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -qx '1.2.2' VERSION
          grep -q "'version' => '1.2.2'" config/app.php
          test -f public/router-api.php
          test -f app/Services/SafeUpdateService.php
          test -f scripts/hot-update-worker.sh
          grep -q "SafeUpdateService" public/router-api.php
          grep -q "case 'update-status'" public/router-api.php
          grep -q "nohup sh" app/Services/SafeUpdateService.php
          grep -q "Không restart PHP/Nginx/Tunnel" app/Services/SafeUpdateService.php
          grep -q "sleep 2" scripts/hot-update-worker.sh
          grep -q "rollback" scripts/hot-update-worker.sh
          grep -q "storage/backups/code-" scripts/hot-update-worker.sh
          ! grep -q "nginx -s reload" scripts/hot-update-worker.sh
          ! grep -q "tms-php-engine" scripts/hot-update-worker.sh
          ! grep -q "cloudflared" scripts/hot-update-worker.sh
          grep -q "'/router-api.php'" public/assets/app.js
          grep -q "update-status" public/assets/app.js
          grep -q "Updater nền" public/assets/app.js
          grep -q "releases/latest/download/RELEASE.json" app/Services/UpdateService.php
          grep -q "raw.githubusercontent.com" app/Services/UpdateService.php
          grep -q "checksum_sha256" app/Services/UpdateService.php
          grep -q "streamChat" app/Services/GatewayService.php
          grep -q "'anthropic'" app/Services/GatewayService.php
          grep -q "'gemini'" app/Services/GatewayService.php
