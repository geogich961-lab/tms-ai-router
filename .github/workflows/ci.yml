name: TMS AI Router CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, curl, sodium, zip
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate v1.1.0 surface
        shell: bash
        run: |
          grep -qx '1.1.0' VERSION
          grep -q "'version' => '1.1.0'" config/app.php
          grep -q "'/v1/responses'" public/index.php
          grep -q "'/admin/api/update/check'" public/index.php
          grep -q "'/admin/api/update/apply'" public/index.php
          grep -q "streamChat" app/Services/GatewayService.php
          grep -q "'anthropic'" app/Services/GatewayService.php
          grep -q "'gemini'" app/Services/GatewayService.php
          grep -q "class UpdateService" app/Services/UpdateService.php
